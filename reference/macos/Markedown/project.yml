name: Markedown

options:
  bundleIdPrefix: com.zhuanz
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  MarkdownEngine:
    path: Vendor/swift-markdown-engine-0.12.0
  SwiftMarkdown:
    path: Vendor/swift-markdown-0.8.0

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: 15.0
    DEVELOPMENT_LANGUAGE: en
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Markedown:
    type: application
    platform: macOS
    sources:
      - path: Sources/Markedown
      - path: Resources
        excludes:
          - Info.plist
          - Markedown.entitlements
        buildPhase: resources
    dependencies:
      - package: MarkdownEngine
        product: MarkdownEngine
      - package: MarkdownEngine
        product: MarkdownEngineCodeBlocks
      - package: MarkdownEngine
        product: MarkdownEngineLatex
      - package: SwiftMarkdown
        product: Markdown
    entitlements:
      path: Resources/Markedown.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhuanz.markedown
        PRODUCT_NAME: Markedown
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 0.1.6
        CURRENT_PROJECT_VERSION: 7
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - MarkedownTests
        - MarkedownUITests
      gatherCoverageData: true

  MarkedownTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MarkedownTests
    dependencies:
      - target: Markedown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhuanz.markedown.tests
        GENERATE_INFOPLIST_FILE: YES

  MarkedownUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/MarkedownUITests
    dependencies:
      - target: Markedown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhuanz.markedown.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Markedown
