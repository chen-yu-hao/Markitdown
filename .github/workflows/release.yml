name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.3.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Preserve Source File Bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Release Tag
        shell: pwsh
        run: |
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -ne "v$($manifest.version)") {
            throw 'Release tag does not match package.json.'
          }
          git show-ref --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'The release tag must already exist.' }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Use Canonical Windows Temp Directory
        shell: pwsh
        run: |
          $ciTemp = Join-Path $env:RUNNER_TEMP markedown
          New-Item -ItemType Directory -Path $ciTemp -Force | Out-Null
          $ciTemp = node -e 'console.log(require("node:fs").realpathSync(process.argv[1]))' $ciTemp
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the CI temp directory.' }
          @("TEMP=$ciTemp", "TMP=$ciTemp") | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: npm ci
      - name: Install Locked Electron Runtime
        run: node node_modules/electron/install.js
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npx electron-builder --win nsis zip --x64 --publish never
      - run: node scripts/verify-packaged.mjs
      - run: node scripts/verify-equation-layout.mjs release/win-unpacked/Markedown.exe
      - name: Verify Packaged Equation Scrolling
        timeout-minutes: 5
        run: node scripts/verify-equation-scroll.mjs release/win-unpacked/Markedown.exe
      - name: Verify Packaged Theme Numbers
        timeout-minutes: 5
        run: node scripts/verify-theme-numbers.mjs release/win-unpacked/Markedown.exe
      - name: Verify Packaged Document Tabs
        timeout-minutes: 10
        run: node scripts/verify-document-tabs.mjs release/win-unpacked/Markedown.exe
      - name: Verify Packaged Sidebar Files
        timeout-minutes: 5
        run: node scripts/verify-file-tree.mjs release/win-unpacked/Markedown.exe
      - name: Verify Packaged Standalone Equations
        timeout-minutes: 5
        run: node scripts/verify-workspace-equations.mjs release/win-unpacked/Markedown.exe
      - run: node scripts/release.mjs

      - name: Publish Verified Assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          $records = Get-Content release/SHA256SUMS.txt
          $downloads = @("Markedown-$($manifest.version)-Windows-x64-Setup.exe", "Markedown-$($manifest.version)-Windows-x64.zip")
          $assets = @()
          foreach ($record in $records) {
            $parts = $record -split '  ', 2
            $filename = Join-Path release $parts[1]
            if ((Get-FileHash -LiteralPath $filename -Algorithm SHA256).Hash.ToLowerInvariant() -ne $parts[0]) {
              throw "Checksum mismatch: $filename"
            }
            if ($parts[1] -cin $downloads) { $assets += $filename }
          }
          if ($assets.Count -ne $downloads.Count -or @($assets | Select-Object -Unique).Count -ne $downloads.Count) {
            throw 'The verified installer and portable ZIP are required.'
          }
          $notes = Get-Content "resources/Release-$($manifest.version).md" -Raw
          $base = "https://github.com/$env:GH_REPO/blob/$env:RELEASE_TAG"
          $notes = $notes.Replace('(Validation.md)', "($base/resources/Validation.md)").Replace('(../README.md)', "($base/README.md)")
          $notesPath = Join-Path $env:RUNNER_TEMP release-notes.md
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8

          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            # Re-running a tag build must be able to refresh an already-published
            # release. Asset names are versioned and --clobber below replaces the
            # previous binaries after all verification steps have passed.
            $isDraft = ($existing | ConvertFrom-Json).isDraft
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "Markedown $($manifest.version) for Windows" --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
          }
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
          $published = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded assets.' }
          if ($published.assets.Count -ne $downloads.Count) { throw 'Only the installer and portable ZIP may be uploaded. GitHub provides source archives automatically.' }
          foreach ($filename in $assets) {
            $file = Get-Item -LiteralPath $filename
            $remote = @($published.assets | Where-Object name -eq $file.Name)
            if ($remote.Count -ne 1 -or $remote[0].size -ne $file.Length) { throw "Uploaded asset mismatch: $filename" }
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
